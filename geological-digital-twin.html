<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geological Digital Twin — DuBois Fluorspar Mine</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; }
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(30, 30, 40, 0.9);
      color: #ccc;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      max-height: 92vh;
      overflow-y: auto;
      min-width: 240px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    #toolbar h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 6px;
    }
    .section-header {
      font-weight: 700;
      color: #8ab4f8;
      margin-top: 10px;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
    }
    .layer-row label { cursor: pointer; flex: 1; }
    .layer-row input[type="checkbox"] { margin-left: 8px; cursor: pointer; }
    .slider-row { margin: 4px 0; }
    .slider-row label { display: block; margin-bottom: 2px; }
    .slider-row input[type="range"] { width: 100%; }
    .slider-val { float: right; color: #aaa; font-size: 12px; }
    .btn-row { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-row button {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .btn-row button:hover { background: rgba(255,255,255,0.15); color: #fff; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="toolbar">
    <h2>Geological Digital Twin</h2>

    <div class="section-header">Geological Entities</div>
    <div class="layer-row"><label for="chkDrill">Drill Holes</label><input type="checkbox" id="chkDrill" checked /></div>
    <div class="layer-row"><label for="chkMainFault">Iron Furnace Fault</label><input type="checkbox" id="chkMainFault" checked /></div>
    <div class="layer-row"><label for="chkSecFaults">Secondary Faults</label><input type="checkbox" id="chkSecFaults" checked /></div>
    <div class="layer-row"><label for="chkOre">Ore Body</label><input type="checkbox" id="chkOre" checked /></div>

    <div class="section-header">WMS Layers</div>
    <div class="layer-row"><label for="chkISGSFaults">ISGS Faults</label><input type="checkbox" id="chkISGSFaults" checked /></div>
    <div class="layer-row"><label for="chkISGSBedrock">ISGS Bedrock</label><input type="checkbox" id="chkISGSBedrock" /></div>
    <div class="layer-row"><label for="chkUSGSGeol">USGS Geology</label><input type="checkbox" id="chkUSGSGeol" /></div>
    <div class="layer-row"><label for="chkUSGSStruct">USGS Structure</label><input type="checkbox" id="chkUSGSStruct" /></div>
    <div class="layer-row"><label for="chkEarthMRI">USGS Earth MRI</label><input type="checkbox" id="chkEarthMRI" checked /></div>
    <div class="layer-row"><label for="chkActiveMines">USGS Active Mines</label><input type="checkbox" id="chkActiveMines" /></div>

    <div class="section-header">Globe Settings</div>
    <div class="slider-row">
      <label>Translucency <span class="slider-val" id="alphaVal">0.20</span></label>
      <input type="range" id="alphaSlider" min="0" max="1" step="0.05" value="0.2" />
    </div>
    <div class="slider-row">
      <label>Vertical Exaggeration <span class="slider-val" id="exagVal">1.5</span></label>
      <input type="range" id="exagSlider" min="1" max="3" step="0.1" value="1.5" />
    </div>

    <div class="section-header">Camera Presets</div>
    <div class="btn-row">
      <button id="btnOverview">Overview</button>
      <button id="btnUnderground">Underground</button>
      <button id="btnCrossSection">Cross-Section</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // IMPORTANT: Replace with your own Cesium ion access token
    // Get one free at https://ion.cesium.com/
    // =========================================================================
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2ZGIxNjM0OC01ZmZmLTQ1MjMtODA3Mi01ZWQ5NjM0Yzc0ZDMiLCJpZCI6MjU5LCJpYXQiOjE3MzUwNjQwOTV9.NeGnPQrMFkPN6xU7sMX6k7IjKGJdEf7EkEPxmBxYjlk";

    // =========================================================================
    // CONSTANTS
    // =========================================================================
    const MINE_LON = -88.37337;
    const MINE_LAT = 37.45424;
    const SURFACE_ELEV = 170;

    const COLORS = {
      alluvium:      Cesium.Color.BROWN,
      steGenevieve:  Cesium.Color.CORNFLOWERBLUE,
      stLouis:       Cesium.Color.STEELBLUE,
      fluorite:      Cesium.Color.MAGENTA.withAlpha(0.9),
      salem:         Cesium.Color.DODGERBLUE,
      hardinsburg:   Cesium.Color.SANDYBROWN,
      golconda:      Cesium.Color.GRAY,
      cypress:       Cesium.Color.KHAKI,
    };

    // =========================================================================
    // SYNTHETIC GEOLOGICAL DATA
    // =========================================================================
    const drillHoles = [
      {
        lon: MINE_LON, lat: MINE_LAT, name: "DH-01",
        intervals: [
          { top: 0, bot: 5, lith: "Alluvium", color: COLORS.alluvium },
          { top: 5, bot: 32, lith: "Ste. Genevieve Ls.", color: COLORS.steGenevieve },
          { top: 32, bot: 55, lith: "St. Louis Ls.", color: COLORS.stLouis },
          { top: 55, bot: 68, lith: "Fluorite ore zone", color: COLORS.fluorite },
          { top: 68, bot: 95, lith: "Salem Ls.", color: COLORS.salem },
          { top: 95, bot: 130, lith: "Hardinsburg Ss.", color: COLORS.hardinsburg },
          { top: 130, bot: 165, lith: "Golconda Fm.", color: COLORS.golconda },
          { top: 165, bot: 200, lith: "Cypress Ss.", color: COLORS.cypress },
        ],
      },
      {
        lon: MINE_LON + 0.0015, lat: MINE_LAT + 0.001, name: "DH-02",
        intervals: [
          { top: 0, bot: 4, lith: "Alluvium", color: COLORS.alluvium },
          { top: 4, bot: 28, lith: "Ste. Genevieve Ls.", color: COLORS.steGenevieve },
          { top: 28, bot: 50, lith: "St. Louis Ls.", color: COLORS.stLouis },
          { top: 50, bot: 60, lith: "Fluorite ore zone", color: COLORS.fluorite },
          { top: 60, bot: 88, lith: "Salem Ls.", color: COLORS.salem },
          { top: 88, bot: 125, lith: "Hardinsburg Ss.", color: COLORS.hardinsburg },
          { top: 125, bot: 158, lith: "Golconda Fm.", color: COLORS.golconda },
          { top: 158, bot: 200, lith: "Cypress Ss.", color: COLORS.cypress },
        ],
      },
      {
        lon: MINE_LON - 0.001, lat: MINE_LAT + 0.0015, name: "DH-03",
        intervals: [
          { top: 0, bot: 6, lith: "Alluvium", color: COLORS.alluvium },
          { top: 6, bot: 35, lith: "Ste. Genevieve Ls.", color: COLORS.steGenevieve },
          { top: 35, bot: 58, lith: "St. Louis Ls.", color: COLORS.stLouis },
          { top: 58, bot: 72, lith: "Fluorite ore zone", color: COLORS.fluorite },
          { top: 72, bot: 98, lith: "Salem Ls.", color: COLORS.salem },
          { top: 98, bot: 135, lith: "Hardinsburg Ss.", color: COLORS.hardinsburg },
          { top: 135, bot: 170, lith: "Golconda Fm.", color: COLORS.golconda },
          { top: 170, bot: 200, lith: "Cypress Ss.", color: COLORS.cypress },
        ],
      },
      {
        lon: MINE_LON + 0.002, lat: MINE_LAT - 0.001, name: "DH-04",
        intervals: [
          { top: 0, bot: 3, lith: "Alluvium", color: COLORS.alluvium },
          { top: 3, bot: 30, lith: "Ste. Genevieve Ls.", color: COLORS.steGenevieve },
          { top: 30, bot: 52, lith: "St. Louis Ls.", color: COLORS.stLouis },
          { top: 52, bot: 85, lith: "Salem Ls.", color: COLORS.salem },
          { top: 85, bot: 120, lith: "Hardinsburg Ss.", color: COLORS.hardinsburg },
          { top: 120, bot: 155, lith: "Golconda Fm.", color: COLORS.golconda },
          { top: 155, bot: 200, lith: "Cypress Ss.", color: COLORS.cypress },
        ],
      },
      {
        lon: MINE_LON - 0.0015, lat: MINE_LAT - 0.0012, name: "DH-05",
        intervals: [
          { top: 0, bot: 7, lith: "Alluvium", color: COLORS.alluvium },
          { top: 7, bot: 38, lith: "Ste. Genevieve Ls.", color: COLORS.steGenevieve },
          { top: 38, bot: 60, lith: "St. Louis Ls.", color: COLORS.stLouis },
          { top: 60, bot: 90, lith: "Salem Ls.", color: COLORS.salem },
          { top: 90, bot: 128, lith: "Hardinsburg Ss.", color: COLORS.hardinsburg },
          { top: 128, bot: 162, lith: "Golconda Fm.", color: COLORS.golconda },
          { top: 162, bot: 200, lith: "Cypress Ss.", color: COLORS.cypress },
        ],
      },
    ];

    const mainFaultTrace = [
      [MINE_LON - 0.008, MINE_LAT - 0.005],
      [MINE_LON - 0.005, MINE_LAT - 0.003],
      [MINE_LON - 0.002, MINE_LAT - 0.001],
      [MINE_LON + 0.001, MINE_LAT + 0.001],
      [MINE_LON + 0.004, MINE_LAT + 0.003],
      [MINE_LON + 0.007, MINE_LAT + 0.005],
    ];

    const oreOutline = [
      MINE_LON - 0.002, MINE_LAT - 0.0008,
      MINE_LON - 0.0005, MINE_LAT + 0.0015,
      MINE_LON + 0.002, MINE_LAT + 0.002,
      MINE_LON + 0.003, MINE_LAT + 0.0015,
      MINE_LON + 0.0025, MINE_LAT - 0.0002,
      MINE_LON + 0.0005, MINE_LAT - 0.001,
    ];

    // =========================================================================
    // HELPER FUNCTIONS
    // =========================================================================
    function createDrillHoles(viewer) {
      const entities = [];
      const RADIUS = 3;
      for (const dh of drillHoles) {
        for (const iv of dh.intervals) {
          const midDepth = (iv.top + iv.bot) / 2;
          const length = iv.bot - iv.top;
          const height = SURFACE_ELEV - midDepth;
          entities.push(viewer.entities.add({
            name: dh.name + ": " + iv.lith,
            description: "<b>" + dh.name + "</b><br>" + iv.lith + "<br>Depth: " + iv.top + " – " + iv.bot + " m",
            position: Cesium.Cartesian3.fromDegrees(dh.lon, dh.lat, height),
            cylinder: {
              length: length,
              topRadius: RADIUS,
              bottomRadius: RADIUS,
              material: iv.color,
              outline: true,
              outlineColor: Cesium.Color.BLACK.withAlpha(0.4),
              numberOfVerticalLines: 8,
              slices: 16,
            },
          }));
        }
      }
      return entities;
    }

    function createMainFault(viewer) {
      const positions = [];
      const minHeights = [];
      for (const pt of mainFaultTrace) {
        positions.push(pt[0], pt[1], SURFACE_ELEV + 50);
        minHeights.push(SURFACE_ELEV - 300);
      }
      return viewer.entities.add({
        name: "Iron Furnace Fault Zone",
        description: "<b>Iron Furnace Fault Zone</b><br>Strike: N55E, near-vertical dip<br>Displacement: ~183 m (600 ft)<br>75-ft gouge/breccia zone observed in outcrop",
        wall: {
          positions: Cesium.Cartesian3.fromDegreesArrayHeights(positions),
          minimumHeights: minHeights,
          material: Cesium.Color.RED.withAlpha(0.3),
          outline: true,
          outlineColor: Cesium.Color.RED,
        },
      });
    }

    function createFaultFromStrikeDip(viewer, name, lon, lat, strikeDegs, dipDegs, lengthM, depthM) {
      const strikeRad = Cesium.Math.toRadians(strikeDegs);
      const dipRad = Cesium.Math.toRadians(dipDegs);
      const dipDirRad = strikeRad + Math.PI / 2;
      const halfLen = lengthM / 2;
      const dipHoriz = depthM / Math.tan(dipRad);
      const mPerDegLat = 111320;
      const mPerDegLon = 111320 * Math.cos(Cesium.Math.toRadians(lat));

      const dLon = (halfLen * Math.sin(strikeRad)) / mPerDegLon;
      const dLat = (halfLen * Math.cos(strikeRad)) / mPerDegLat;
      const ddLon = (dipHoriz * Math.sin(dipDirRad)) / mPerDegLon;
      const ddLat = (dipHoriz * Math.cos(dipDirRad)) / mPerDegLat;

      const corners = Cesium.Cartesian3.fromDegreesArrayHeights([
        lon - dLon, lat - dLat, SURFACE_ELEV,
        lon + dLon, lat + dLat, SURFACE_ELEV,
        lon + dLon + ddLon, lat + dLat + ddLat, SURFACE_ELEV - depthM,
        lon - dLon + ddLon, lat - dLat + ddLat, SURFACE_ELEV - depthM,
      ]);

      return viewer.entities.add({
        name: name,
        description: "<b>" + name + "</b><br>Strike: " + strikeDegs + "&deg;, Dip: " + dipDegs + "&deg;",
        polygon: {
          hierarchy: new Cesium.PolygonHierarchy(corners),
          perPositionHeight: true,
          material: Cesium.Color.ORANGE.withAlpha(0.3),
          outline: true,
          outlineColor: Cesium.Color.ORANGE,
        },
      });
    }

    function createOreBody(viewer) {
      return viewer.entities.add({
        name: "Fluorite Ore Body (Ste. Genevieve Ls.)",
        description: "<b>Fluorite Ore Zone</b><br>Host: Ste. Genevieve Limestone<br>Mineralization: Fluorite + galena + sphalerite<br>Type: Vein deposit along fault zone",
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray(oreOutline),
          height: SURFACE_ELEV - 68,
          extrudedHeight: SURFACE_ELEV - 32,
          material: Cesium.Color.GOLD.withAlpha(0.4),
          outline: true,
          outlineColor: Cesium.Color.GOLD,
        },
      });
    }

    // =========================================================================
    // VIEWER SETUP
    // =========================================================================
    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain({ requestVertexNormals: true }),
      baseLayerPicker: false,
      geocoder: false,
      animation: false,
      timeline: false,
    });

    const scene = viewer.scene;
    const globe = scene.globe;

    scene.screenSpaceCameraController.enableCollisionDetection = false;
    globe.translucency.enabled = true;
    globe.translucency.frontFaceAlphaByDistance = new Cesium.NearFarScalar(400.0, 0.2, 8000.0, 1.0);
    globe.undergroundColor = Cesium.Color.fromCssColorString("#1a1a2e");
    globe.undergroundColorAlphaByDistance = new Cesium.NearFarScalar(1000.0, 0.5, 8000.0, 0.0);
    globe.enableLighting = true;
    scene.verticalExaggeration = 1.5;

    // =========================================================================
    // CREATE GEOLOGICAL ENTITIES
    // =========================================================================
    const drillHoleEntities = createDrillHoles(viewer);
    const mainFaultEntity = createMainFault(viewer);
    const secFault1 = createFaultFromStrikeDip(viewer, "Splay Fault A (NNE)", MINE_LON - 0.003, MINE_LAT + 0.002, 30, 70, 800, 250);
    const secFault2 = createFaultFromStrikeDip(viewer, "Splay Fault B (ENE)", MINE_LON + 0.004, MINE_LAT - 0.001, 80, 60, 600, 200);
    const oreBodyEntity = createOreBody(viewer);

    // =========================================================================
    // WMS LAYERS
    // =========================================================================
    function addWMS(url, layers, alpha, show) {
      const layer = new Cesium.ImageryLayer(
        new Cesium.WebMapServiceImageryProvider({
          url: url,
          layers: layers,
          parameters: { transparent: true, format: "image/png" },
        })
      );
      layer.alpha = alpha;
      layer.show = show;
      viewer.imageryLayers.add(layer);
      return layer;
    }

    const isgsFaultsLayer   = addWMS("https://data.isgs.illinois.edu/arcgis/services/Geology/OIINK/MapServer/WMSServer", "53", 0.7, true);
    const isgsBedrockLayer  = addWMS("https://data.isgs.illinois.edu/arcgis/services/Geology/OIINK/MapServer/WMSServer", "17", 0.6, false);
    const usgsGeologyLayer  = addWMS("https://mrdata.usgs.gov/services/sgmc2", "SGMC_Geology", 0.5, false);
    const usgsStructLayer   = addWMS("https://mrdata.usgs.gov/services/sgmc2", "SGMC_Structure", 0.6, false);
    const earthMRILayer     = addWMS("https://mrdata.usgs.gov/services/mrds", "mrds", 0.8, true);
    const activeMinesLayer  = addWMS("https://mrdata.usgs.gov/services/active-mines", "active-mines", 0.7, false);

    // =========================================================================
    // CLIPPING PLANES
    // =========================================================================
    const mineCenter = Cesium.Cartesian3.fromDegrees(MINE_LON, MINE_LAT, SURFACE_ELEV);
    globe.clippingPlanes = new Cesium.ClippingPlaneCollection({
      modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(mineCenter),
      planes: [new Cesium.ClippingPlane(new Cesium.Cartesian3(0.0, 1.0, 0.0), 0.0)],
      edgeWidth: 2.0,
      edgeColor: Cesium.Color.WHITE,
      enabled: false,
    });

    // =========================================================================
    // TOOLBAR WIRING
    // =========================================================================
    function bind(id, fn) { document.getElementById(id).addEventListener("change", fn); }

    bind("chkDrill",      function(e) { drillHoleEntities.forEach(function(ent) { ent.show = e.target.checked; }); });
    bind("chkMainFault",  function(e) { mainFaultEntity.show = e.target.checked; });
    bind("chkSecFaults",  function(e) { secFault1.show = secFault2.show = e.target.checked; });
    bind("chkOre",        function(e) { oreBodyEntity.show = e.target.checked; });
    bind("chkISGSFaults", function(e) { isgsFaultsLayer.show = e.target.checked; });
    bind("chkISGSBedrock",function(e) { isgsBedrockLayer.show = e.target.checked; });
    bind("chkUSGSGeol",   function(e) { usgsGeologyLayer.show = e.target.checked; });
    bind("chkUSGSStruct", function(e) { usgsStructLayer.show = e.target.checked; });
    bind("chkEarthMRI",   function(e) { earthMRILayer.show = e.target.checked; });
    bind("chkActiveMines",function(e) { activeMinesLayer.show = e.target.checked; });

    document.getElementById("alphaSlider").addEventListener("input", function(e) {
      var v = parseFloat(e.target.value);
      globe.translucency.frontFaceAlphaByDistance.nearValue = v;
      document.getElementById("alphaVal").textContent = v.toFixed(2);
    });
    document.getElementById("exagSlider").addEventListener("input", function(e) {
      var v = parseFloat(e.target.value);
      scene.verticalExaggeration = v;
      document.getElementById("exagVal").textContent = v.toFixed(1);
    });

    // Camera presets
    document.getElementById("btnOverview").addEventListener("click", function() {
      globe.clippingPlanes.enabled = false;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(MINE_LON, MINE_LAT - 0.03, 5000),
        orientation: { heading: Cesium.Math.toRadians(10), pitch: Cesium.Math.toRadians(-45), roll: 0 },
        duration: 2.0,
      });
    });
    document.getElementById("btnUnderground").addEventListener("click", function() {
      globe.clippingPlanes.enabled = false;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(MINE_LON - 0.003, MINE_LAT, SURFACE_ELEV - 80),
        orientation: { heading: Cesium.Math.toRadians(45), pitch: Cesium.Math.toRadians(10), roll: 0 },
        duration: 2.0,
      });
    });
    document.getElementById("btnCrossSection").addEventListener("click", function() {
      globe.clippingPlanes.enabled = true;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(MINE_LON, MINE_LAT - 0.008, 1500),
        orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-15), roll: 0 },
        duration: 2.0,
      });
    });

    // =========================================================================
    // INITIAL CAMERA
    // =========================================================================
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(MINE_LON, MINE_LAT - 0.03, 5000),
      orientation: { heading: Cesium.Math.toRadians(10), pitch: Cesium.Math.toRadians(-45), roll: 0 },
    });
  </script>
</body>
</html>
